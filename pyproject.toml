[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.3.0"
description = "OpenAI-compatible gateway that loads Big Bertha rig models on demand"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.54,<1",
  "filelock>=3.12,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
