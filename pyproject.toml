[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.2.0"
description = "OpenAI-compatible gateway that loads Big Bertha rig models on demand"
requires-python = ">=3.11"
# Standard library only: deploys to the rig or the Pi with no venv and no package install.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
