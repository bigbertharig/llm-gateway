[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.4.0"
description = "OpenAI-compatible gateway that loads Big Bertha rig models on demand"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
google = [
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.150,<3",
]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
llm_gateway = ["dashboard/static/*.html", "dashboard/static/*.js", "dashboard/static/*.css", "dashboard/*.json"]
