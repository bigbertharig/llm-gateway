<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a22">
<title>Rig mobile</title>
<style>
  :root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#101922;color:#edf4f6}
  *{box-sizing:border-box}html,body{width:100%;max-width:100%}body{margin:0;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:2;background:#111a22e8;border-bottom:1px solid #314451;padding:14px 18px;backdrop-filter:blur(12px)}
  header strong{font-size:18px;letter-spacing:.02em}header small{display:block;color:#a8bac4}
  nav{display:flex;gap:8px;margin-top:12px}button{font:inherit;cursor:pointer;border:1px solid #46606e;border-radius:10px;background:#1b2a35;color:#edf4f6;padding:9px 12px}button:disabled{opacity:.45;cursor:default}
  button.active,button.primary{background:#327e73;border-color:#53a698;color:white}button.danger{background:#713733;border-color:#b55b50}
  main{width:100%;min-width:0;max-width:960px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.panel{min-width:0;max-width:100%;border:1px solid #304653;border-radius:14px;background:#17242e;padding:16px}
  h1,h2,h3,p{margin:0 0 10px}h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}small,.muted{color:#a9bac4}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:9px}
  .metric{padding:10px 12px;border-radius:10px;background:#21333e;min-width:100px;flex:1}.metric b{display:block;font-size:18px}
  .conversation{width:100%;min-width:0;text-align:left;padding:12px;overflow-wrap:anywhere}.conversation small{display:block}.messages{min-width:0;max-width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-height:50vh;overflow-y:auto;overflow-x:hidden;margin:12px 0}
  .conversation time{display:block;color:#9bdbc9;font-size:12px;margin-top:5px}
  .message{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 13px;border-radius:12px;background:#223440}.message.user{background:#244a47;margin-left:12%}
  textarea,input,select{width:100%;font:inherit;color:#edf4f6;background:#111c24;border:1px solid #46606e;border-radius:10px;padding:10px}textarea{min-height:92px;resize:vertical}
  .notice{min-width:0;max-width:100%;overflow-wrap:anywhere;padding:10px 12px;border-radius:10px;background:#503b27;color:#ffe6bb}.error{background:#5a302f;color:#ffd9d6}
  .hide{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}
  .hero{display:flex;align-items:center;gap:18px}.ring{--fill:0%;width:94px;height:94px;flex:none;border-radius:50%;background:conic-gradient(#50b6a2 var(--fill),#29404a 0);display:grid;place-items:center}.ring span{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:#17242e;font-size:24px;font-weight:700}
  .eyebrow{color:#92aab5;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.hero-copy{flex:1}.hero-copy h2{font-size:26px;margin:2px 0}.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#234d43;color:#a8f1d6}.pill.warn{background:#5a4526;color:#ffe4a8}.pill.bad{background:#633334;color:#ffd5d5}
  .gpu-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.gpu-card{padding:13px;border:1px solid #36515d;border-radius:12px;background:#1b2d38}.gpu-card h3{margin:0;font-size:15px}.gpu-card .row{justify-content:space-between}.gpu-card .muted{font-size:12px}.bar-label{display:flex;justify-content:space-between;font-size:12px;margin:10px 0 3px}.bar{height:7px;background:#304651;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#57b7a6;border-radius:inherit}.bar.memory i{background:#679ed3}
  .work-card{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #36515d;border-radius:10px;background:#1b2d38;padding:11px}.work-card strong{display:block;overflow-wrap:anywhere}.work-card small{display:block}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}.section-head h2{margin:0}
  #chatPanel{min-width:0}.chat-heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}.chat-heading h2{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}.chat-heading button{flex:none}
</style>
<header><strong>Rig mobile</strong><small>Private session access</small><nav><button id="statusTab" class="active">Status</button><button id="workTab">Work</button></nav></header>
<main id="statusView">
  <section class="panel"><div class="row between"><div><div class="eyebrow">Remote check-in</div><h1>Rig overview</h1></div><button id="refreshStatus">Refresh</button></div><div id="statusMessage" class="muted">Loading…</div><div class="hero"><div id="capacityRing" class="ring"><span id="capacityValue">—</span></div><div class="hero-copy"><div class="eyebrow">GPU cards ready to allocate</div><h2 id="capacityLabel">Checking</h2><span id="healthPill" class="pill">Connecting</span></div></div><div id="metrics" class="row"></div></section>
  <section class="panel"><div class="section-head"><h2>Graphics cards</h2><small id="gpuCount"></small></div><div id="gpuCards" class="gpu-grid"></div></section>
  <section class="panel"><div class="section-head"><h2>Work in progress</h2><small id="workMode"></small></div><div id="workSummary" class="row"></div><div id="activeRuns" class="stack"></div></section>
</main>
<main id="workView" class="work hide">
  <div id="workTitle" class="row between"><h1>Conversations</h1><button id="refreshWork">Refresh</button></div>
  <section id="listPanel" class="panel"><div id="conversationList" class="stack"></div></section>
  <section id="chatPanel" class="panel hide"><div class="chat-heading"><button id="backToList" type="button" aria-label="Back to conversations">← Back</button><h2 id="conversationTitle">Conversation</h2></div><div class="row between"><span id="turnState" class="muted"></span></div>
    <div id="conversationMeta" class="muted"></div><div id="messages" class="messages"></div>
    <div id="approvals" class="stack"></div>
    <form id="sendForm" class="stack hide"><label for="message">Continue this work</label><textarea id="message" maxlength="40000" required></textarea><div class="row"><button class="primary" type="submit">Send</button><button id="interrupt" type="button" class="hide">Stop current turn</button></div></form>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let selected=null,conversation=null,permissions=new Set();
const json=async(path,options={})=>{const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options});const data=await response.json();if(!response.ok)throw Error(data.error?.message||data.error||`HTTP ${response.status}`);return data};
const post=(path,data)=>json(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const text=(node,value)=>{node.textContent=value==null?'':String(value)};
function show(name){$('statusView').classList.toggle('hide',name!=='status');$('workView').classList.toggle('hide',name!=='work');$('statusTab').classList.toggle('active',name==='status');$('workTab').classList.toggle('active',name==='work');if(name==='work')loadWork()}
$('statusTab').onclick=()=>show('status');$('workTab').onclick=()=>show('work');$('refreshStatus').onclick=loadStatus;$('refreshWork').onclick=loadWork;
function showList(){selected=null;conversation=null;$('workTitle').classList.remove('hide');$('listPanel').classList.remove('hide');$('chatPanel').classList.add('hide');window.scrollTo(0,0);loadWork()}
function showChat(){ $('workTitle').classList.add('hide');$('listPanel').classList.add('hide');$('chatPanel').classList.remove('hide');window.scrollTo(0,0) }
$('backToList').onclick=showList;
const percent=value=>Math.max(0,Math.min(100,Number(value)||0));
const compact=value=>Number.isFinite(Number(value))?Math.round(Number(value)).toLocaleString():'—';
function metric(label,value){const box=document.createElement('div');box.className='metric';const heading=document.createElement('small');text(heading,label);const strong=document.createElement('b');text(strong,value);box.append(heading,strong);return box}
function meter(parent,label,value,detail,kind=''){const caption=document.createElement('div');caption.className='bar-label';const left=document.createElement('span');text(left,label);const right=document.createElement('span');text(right,detail);caption.append(left,right);const track=document.createElement('div');track.className='bar '+kind;const fill=document.createElement('i');fill.style.width=`${percent(value)}%`;track.append(fill);parent.append(caption,track)}
function renderGpu(gpu){const card=document.createElement('article');card.className='gpu-card';const top=document.createElement('div');top.className='row';const title=document.createElement('h3');text(title,`GPU ${gpu.gpu} · ${(gpu.name||'Graphics card').replace(/^NVIDIA GeForce /,'')}`);const state=document.createElement('span');state.className='pill '+(gpu.verdict==='free'?'':'warn');const verdictLabels={free:'Ready',claimed:'Reserved',leased:'In use',loading:'Loading',lease_idle:'Reserved',stale:'Needs attention',unleased_busy:'In use'};text(state,verdictLabels[gpu.verdict]||gpu.verdict||'Unknown');top.append(title,state);card.append(top);const observed=gpu.observed||{};const usage=Number(observed.used_mb)||0;const capacity=Number(gpu.vram_mb)||0;meter(card,'GPU use',observed.util_pct,`${compact(observed.util_pct)}%`);meter(card,'Memory',capacity?usage/capacity*100:0,`${(usage/1024).toFixed(1)} / ${(capacity/1024).toFixed(1)} GB`,'memory');const foot=document.createElement('div');foot.className='row muted';foot.style.marginTop='10px';text(foot,`${observed.temp_c==null?'—':compact(observed.temp_c)+'°C'} · ${observed.power_w==null?'—':compact(observed.power_w)+' W'}${gpu.claim_info?.model?' · '+gpu.claim_info.model:''}`);card.append(foot);return card}
function renderWork(rig,orchestration){const summary=$('workSummary');summary.replaceChildren(metric('Active batches',orchestration.active_batch_count??0),metric('Workers',orchestration.workers?.length??0));text($('workMode'),orchestration.task_mode||rig.mode||'unknown');const list=$('activeRuns');list.replaceChildren();const batches=Object.values(orchestration.active_batches||{});const jobs=(rig.jobs||[]).filter(item=>['running','starting','queued'].includes(item.state));const plan=(rig.plan?.items||[]).filter(item=>['running','starting','queued'].includes(item.state));for(const item of [...batches,...jobs,...plan].slice(0,5)){const card=document.createElement('div');card.className='work-card';const name=document.createElement('strong');text(name,item.run||item.name||item.args?.run||item.id||'Active work');const detail=document.createElement('small');text(detail,item.state||item.status||'active');card.append(name,detail);list.append(card)}if(!list.children.length){const empty=document.createElement('div');empty.className='muted';text(empty,'No active runs or batches right now.');list.append(empty)}}
async function loadStatus(){text($('statusMessage'),'Checking current state…');try{const [rig,orchestration]=await Promise.all([json('/mobile/api/rig'),json('/mobile/api/orchestration')]);$('statusMessage').className='muted';text($('statusMessage'),`Updated ${new Date().toLocaleTimeString()}`);const gpus=rig.gpus||[];const free=gpus.filter(item=>item.verdict==='free').length;const inUse=gpus.filter(item=>['unleased_busy','leased','loading'].includes(item.verdict)).length;const reserved=gpus.filter(item=>['claimed','lease_idle'].includes(item.verdict)).length;const other=gpus.length-free-inUse-reserved;const ratio=gpus.length?Math.round(free/gpus.length*100):0;$('capacityRing').style.setProperty('--fill',`${ratio}%`);text($('capacityValue'),`${ratio}%`);text($('capacityLabel'),`${free} of ${gpus.length} cards ready`);const guard=orchestration.hardware?.guard_level||'unknown';const healthy=guard==='ok'&&orchestration.hardware?.gpu_scan_ok!==false&&!rig.last_error&&!rig.state_error;const pill=$('healthPill');pill.className='pill '+(healthy?'':'warn');text(pill,healthy?'Systems healthy':`Attention · ${guard}`);const metrics=$('metrics');const items=[metric('In use',inUse),metric('Reserved',reserved),metric('Rig mode',rig.mode||'unknown')];if(other)items.splice(2,0,metric('Other unavailable',other));metrics.replaceChildren(...items);text($('gpuCount'),`${gpus.length} detected`);const cards=$('gpuCards');cards.replaceChildren();for(const gpu of gpus)cards.append(renderGpu(gpu));if(!gpus.length){const empty=document.createElement('div');empty.className='notice';text(empty,'No GPU telemetry available.');cards.append(empty)}renderWork(rig,orchestration)}catch(error){text($('statusMessage'),error.message);$('statusMessage').className='notice error'}}
function relativeTime(stamp){const date=new Date(stamp);if(Number.isNaN(date.getTime()))return 'Date unavailable';const minutes=Math.max(0,Math.floor((Date.now()-date.getTime())/60000));if(minutes<1)return 'just now';if(minutes<60)return `${minutes} min ago`;const hours=Math.floor(minutes/60);if(hours<24)return `${hours} hr ago`;const days=Math.floor(hours/24);return days<7?`${days} days ago`:date.toLocaleDateString()}
function conversationLabel(c){const kind=c.mode==='coding'?'Coding':'Chat';const provider=c.provider==='codex'?'Codex':'Local model';const workspace=c.mode==='coding'&&c.cwd?String(c.cwd).split(/[\\/]/).filter(Boolean).at(-1):'';return [kind,provider,workspace].filter(Boolean).join(' · ')}
async function loadWork(){try{const result=await json('/mobile/api/conversations');const rows=result.conversations||[];const list=$('conversationList');list.replaceChildren();if(!rows.length){text(list,'No saved conversations yet. Start one on the local dashboard.');return}for(const row of rows){const button=document.createElement('button');button.className='conversation';const title=document.createElement('span');text(title,row.title||'Untitled');const meta=document.createElement('small');text(meta,`${conversationLabel(row)} · ${row.last_turn_state||'idle'}`);const when=document.createElement('time');const stamp=row.updated_at||row.last_message_at||row.created_at;when.dateTime=stamp||'';when.title=stamp?new Date(stamp).toLocaleString():'';text(when,`Last chat activity ${relativeTime(stamp)}`);button.append(title,meta,when);button.onclick=()=>openConversation(row.id,true);list.append(button)}}catch(error){text($('conversationList'),error.message)}}
function activityText(event){
  if(event.type==='tool')return `${event.name||'Tool'} · ${event.path||event.url||''} · ${event.result||'running'}`;
  const item=event.item||{};
  if(item.type==='reasoning'||item.type==='userMessage'||(item.type==='agentMessage'&&item.phase==='final_answer'))return '';
  if(item.type==='agentMessage')return item.text||'';
  if(item.type==='mcpToolCall')return `${[item.server,item.tool].filter(Boolean).join('.')||'MCP tool'} · ${item.status||(event.method==='item/started'?'running':'completed')}`;
  const detail=item.command||item.text||(Array.isArray(item.changes)?item.changes.map(change=>change.path).join(', '):'')||item.type;
  return detail?`${event.method==='item/started'?'Working':'Done'} · ${String(detail).slice(0,800)}`:'';
}
function renderMessages(current,liveEvents=[],forceBottom=false){
  const id=current.id,messages=$('messages');
  const atBottom=forceBottom||messages.scrollHeight-messages.scrollTop-messages.clientHeight<80;
  const priorScroll=messages.scrollTop;
  messages.replaceChildren();
  const add=(value,kind)=>{const block=document.createElement('div');block.className=kind; text(block,value);messages.append(block)};
  const activity=events=>{const seen=new Set();for(const [index,event] of (events||[]).entries()){
    const key=event.item?.id?`${event.item.id}:${event.method||''}:${event.item.status||''}`:`${event.method||event.type}:${event.received_at||''}:${index}`;
    if(seen.has(key))continue;seen.add(key);const value=activityText(event);
    if(value)add(value.slice(0,1200),'work-card');
  }};
  for(const item of current.messages||[]){add(item.content||'',`message ${item.role==='user'?'user':'assistant'}`);activity(item.activity)}
  const turn=current.last_turn;
  if(turn&&turn.state!=='completed'){
    add(turn.prompt||'(request in progress)','message user');
    for(const steer of turn.steers||[])add(steer.content||'','message user');
    activity([...(turn.activity||[]),...liveEvents]);
    if(turn.state==='running'&&!liveEvents.length&&!(turn.activity||[]).length)add('Working…','muted');
    if(turn.error)add(`${turn.state}: ${turn.error}`,'notice error');
  }
  requestAnimationFrame(()=>{if(selected===id&&!$('chatPanel').classList.contains('hide'))messages.scrollTop=atBottom?messages.scrollHeight:priorScroll});
}
async function openConversation(id,navigate=false){selected=id;if(navigate){showChat();text($('conversationTitle'),'Opening conversation…')}try{const current=await json(`/mobile/api/conversations/${id}`);if(selected!==id)return;conversation=current;text($('conversationTitle'),conversation.title||'Conversation');text($('conversationMeta'),conversationLabel(conversation));text($('turnState'),conversation.last_turn?.state||'idle');renderMessages(current,[],navigate);const running=conversation.last_turn?.state==='running';$('sendForm').classList.toggle('hide',!permissions.has('continue')||(running&&conversation.provider!=='codex'));text($('sendForm').querySelector('button[type=submit]'),running?'Steer current turn':'Send');$('interrupt').classList.toggle('hide',!running||!permissions.has('interrupt'));if(conversation.provider==='codex')await loadAgent(id,navigate);else $('approvals').replaceChildren()}catch(error){text($('conversationTitle'),error.message)}}
async function loadAgent(id,navigate=false){try{const state=await json(`/mobile/api/conversations/${id}/agent`);if(selected!==id)return;if(conversation?.last_turn?.state==='running')renderMessages(conversation,state.events||[],navigate);const box=$('approvals');box.replaceChildren();for(const item of state.approvals||[]){const card=document.createElement('div');card.className='notice';const description=document.createElement('pre');text(description,JSON.stringify(item.preview||item.params||{},null,2));card.append(description);if(permissions.has('approve'))for(const decision of ['accept','decline']){const button=document.createElement('button');text(button,decision==='accept'?'Approve':'Decline');button.onclick=async()=>{if(decision==='accept'&&!confirm('Approve this exact action?'))return;try{await post(`/mobile/api/conversations/${id}/agent/approval`,{request_id:item.id,decision});await openConversation(id)}catch(error){alert(error.message)}};card.append(button)}box.append(card)}}catch(error){text($('approvals'),error.message)}}
$('sendForm').onsubmit=async event=>{event.preventDefault();if(!selected||!conversation)return;const value=$('message').value.trim();if(!value)return;const button=$('sendForm').querySelector('button[type=submit]');button.disabled=true;try{const target=selected;if(conversation.provider==='local'){const response=await fetch(`/mobile/api/conversations/${target}/turn`,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:conversation.model,message:value,stream:true})});if(!response.ok){const data=await response.json();throw Error(data.error?.message||data.error||`HTTP ${response.status}`)}$('message').value='';await openConversation(target);const reader=response.body.getReader();while(true){const result=await reader.read();if(result.done)break}await openConversation(target)}else{const running=conversation.last_turn?.state==='running';await post(`/mobile/api/conversations/${target}/${running?'agent/steer':'turn'}`,running?{message:value}:{model:conversation.model,message:value});$('message').value='';await openConversation(target)}}catch(error){alert(error.message)}finally{button.disabled=false}};
$('interrupt').onclick=async()=>{if(!selected||!confirm('Stop the current turn?'))return;try{await post(`/mobile/api/conversations/${selected}/agent/interrupt`,{});await openConversation(selected)}catch(error){alert(error.message)}};
async function start(){try{const caps=await json('/mobile/api/capabilities');permissions=new Set(caps.permissions||[])}catch(error){text($('statusMessage'),error.message)}loadStatus();setInterval(()=>{if(!$('chatPanel').classList.contains('hide')&&!$('workView').classList.contains('hide')&&selected)openConversation(selected)},5000);setInterval(()=>{if(!$('listPanel').classList.contains('hide')&&!$('workView').classList.contains('hide'))loadWork()},15000);setInterval(()=>{if(!$('statusView').classList.contains('hide'))loadStatus()},20000)}start();
</script>
</html>
